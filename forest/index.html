<style>
:root { --bg:#10261c; --ink:#f4f1e6; --dim:#a9c4b0; --line:var(--cl); --gold:var(--amber); }

#me { position:fixed; right:8px; top:calc(var(--barH, 40px) + 8px); z-index:6; width:min(300px, calc(100vw - 16px)); max-height:calc(100dvh - var(--barH, 40px) - 24px); overflow:auto; background:var(--glass); border:1px solid var(--line); border-radius:14px; padding:10px 12px; display:none; }

/* ===== 7단계: 모바일 게임식 메뉴 (상단 HUD · 하단 탭 바 · 바텀시트) · 키우기 타이쿤 ===== */
:root { --tabBase: calc(56px + env(safe-area-inset-bottom, 0px)); --tabH: var(--tabBase); }
#bar { flex-wrap:nowrap; gap:6px 8px; min-height:46px; font-size:15px; padding:max(6px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) 6px max(10px,env(safe-area-inset-left)); }

#tabs { position:fixed; left:0; right:0; bottom:0; z-index:9; display:flex; height:var(--tabBase); padding:0 env(safe-area-inset-right) env(safe-area-inset-bottom,0px) env(safe-area-inset-left); background:rgba(12,30,22,.97); border-top:1px solid var(--line); }

#tabs .tb .ic { font-size:24px; line-height:1.05; transition:transform .15s; }
#tabs .tb:active .ic { transform:scale(.88); }
#tabs .tb.on { color:var(--gold); } #tabs .tb.on::before { content:''; position:absolute; top:0; left:26%; right:26%; height:3px; border-radius:0 0 3px 3px; background:var(--gold); }

#tabs .bdg2 { position:absolute; top:3px; left:calc(50% + 7px); min-width:19px; height:19px; border-radius:var(--r2); background:#ff5d6c; color:#fff; font-size:12px; line-height:19px; text-align:center; padding:0 5px; font-weight:800; display:none; box-shadow:0 0 0 2px rgba(12,30,22,.97); animation:qpop 1.3s ease-in-out infinite; }

#shGrab { flex:none; height:24px; display:flex; align-items:center; justify-content:center; touch-action:none; cursor:grab; } #shGrab i { width:46px; height:5px; border-radius:var(--r); background:var(--cl); }

#sheet #me, #sheet #mk, #sheet #qp, #sheet #cp, #sheet #fbDress, #sheet #yard, #sheet #more { position:static; right:auto; top:auto; width:auto; max-height:none; overflow:visible; background:none; border:0; border-radius:0; padding:0; font-size:16px; }

#sheet h3 { font-size:17px; margin:2px 0 8px; } #sheet .btn { font-size:15px; min-height:44px; padding:6px 15px; } #sheet .btn.big { font-size:16px; }
#sheet .sub, #sheet .qs, #sheet .msg, #sheet .dim { font-size:16px; } #sheet #me .stat { font-size:16px; grid-template-columns:52px 1fr 32px; } #sheet #me .bar { height:9px; border-radius:var(--r); }
#sheet #me .nit { font-size:20px; } #sheet #mk .inv { grid-template-columns:repeat(auto-fit,minmax(92px,1fr)) !important; } #sheet #mk .inv div { font-size:16px; padding:6px 2px; } #sheet #mk .inv b { font-size:17px; }
#sheet .row { margin:6px 0 !important; } #sheet .tabs { gap:6px; } #sheet #qp .tabs .btn, #sheet #cp .tabs .btn { flex:1; } #sheet #qp .qc { padding:9px 10px; } #sheet #qp .qt { font-size:16px; } #sheet #qp .qi { width:40px; height:40px; font-size:22px; }

.ty-row { display:flex; align-items:center; gap:8px; background:var(--c1); border-radius:var(--r2); padding:8px 10px; margin:6px 0; }
.ty-row .ic { font-size:26px; flex:none; width:34px; text-align:center; } .ty-row .mid { flex:1; min-width:0; } .ty-row .nm { font-size:16px; font-weight:700; display:flex; justify-content:space-between; gap:6px; }
.ty-row .nm span { font-weight:400; font-size:16px; color:var(--dim); } .ty-row .nm { flex-wrap:wrap; }
.tbar { position:relative; height:16px; background:#0f2218; border-radius:var(--r2); overflow:hidden; margin:4px 0 2px; border:1px solid #284a38; }
.tbar i { position:absolute; left:0; top:0; bottom:0; background:linear-gradient(90deg,var(--leaf),var(--amber)); border-radius:var(--r2); } .tbar.full i { background:linear-gradient(90deg,var(--amber),#ff9a4a); }
.tbar b { position:absolute; left:0; right:0; top:0; text-align:center; font-size:12px; line-height:16px; text-shadow:0 1px 2px #000a; }
.ty-row .acts { display:flex; flex-direction:column; gap:4px; flex:none; } .ty-row .btn { min-height:38px !important; font-size:14px !important; padding:3px 10px !important; }
#tyc { position:fixed; left:50%; transform:translateX(-50%); bottom:calc(var(--tabH) + 62px); z-index:7; display:none; width:min(440px,calc(100vw - 16px)); background:var(--glass); border:1px solid #8a6a1f; border-radius:var(--r2); padding:10px 12px; font-size:15px; box-shadow:0 4px 18px rgba(0,0,0,.4); }
#tyc.show { display:block; animation:shUp .2s ease-out; } #tyc .h { display:flex; align-items:center; gap:8px; } #tyc .h b { font-size:16px; } #tyc .h .dim { font-size:13px; margin-left:auto; text-align:right; }

#act { bottom:calc(var(--tabH) + 8px); } #tip { bottom:calc(var(--tabH) + 10px); } #card { bottom:calc(var(--tabH) + 8px); } #chat { bottom:calc(var(--tabH) + 8px); } #gver { bottom:calc(var(--tabH) + 2px); }

  :root { --tabBase: calc(48px + env(safe-area-inset-bottom, 0px)); }
  #bar { min-height:38px; padding-top:max(3px,env(safe-area-inset-top)); padding-bottom:3px; } #bar .hp { min-height:30px; padding:3px 10px; font-size:15px; }

  #sheet { left:auto; right:0; top:calc(var(--barH,40px) + 2px); bottom:var(--tabH); width:min(430px,50vw); max-height:none; margin:0; border-radius:var(--r2) 0 0 0; border-right:0; }
  #sheet.open { animation:shLeft .2s ease-out; } @keyframes shLeft { from { transform:translateX(40px); opacity:0; } }

}
/* ===== 8단계: UI 정리 — 디자인 토큰 · 직접 그린 아이콘 · 첫 임무 카드 · 진화 연출 · 숨은 재미 ===== */
:root { --p0:#0e1a13; --p1:#16261c; --p2:#1f3327; --pl:#3a5a46; --paper:#efe3c2; --paper2:#e2d3ab; --pink:#35281a; --amber:#e9b44c; --amberD:#8f6418; --leaf:#86c06c; --berry:#d9604c; --r:6px; --sh:0 2px 0 rgba(0,0,0,.4); }
.ico { width:1.3em; height:1.3em; fill:none; stroke:currentColor; stroke-width:2.4; stroke-linecap:square; stroke-linejoin:miter; vertical-align:-.28em; flex:none; }
.ico.f { fill:currentColor; stroke:none; }
/* 버튼 · 시트: 둥근 알약 대신 각진 도트풍 (눌리면 2px 내려감) */
.btn, #bar .hp, .sub-b { border-radius:var(--r); border-width:2px; border-color:var(--pl); background:var(--p2); box-shadow:var(--sh); transition:transform .06s, box-shadow .06s, background .1s; }
.btn:active, #bar .hp:active, .sub-b:active { transform:translateY(2px); box-shadow:0 0 0 rgba(0,0,0,.4); }
.btn.gold, #bar .hp.gold { border-color:var(--amberD); background:#4a3814; color:var(--amber); }
.btn.on, .sub-b.on { background:#2e5a3e; border-color:var(--leaf); }
#sheet { border-radius:var(--r2) 10px 0 0; border:2px solid var(--pl); border-bottom:0; background:var(--glass); }
#shGrab i { background:var(--pl); }
#tabs { background:var(--p0); border-top:2px solid var(--pl); }
#tabs .tb { gap:0; }
