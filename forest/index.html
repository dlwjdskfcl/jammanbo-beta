<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#10261c">
<title>잠만보 숲속 마당</title>
<style>
:root { --bg:#10261c; --ink:#f4f1e6; --dim:#a9c4b0; --line:#2b4a3a; --gold:#ffd86b; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin:0; height:100%; overflow:hidden; background:var(--bg); color:var(--ink); font:13px/1.4 system-ui,"Malgun Gothic",sans-serif; overscroll-behavior:none; }
#view { position:fixed; left:0; top:0; width:100vw; height:100vh; height:100dvh; touch-action:none; display:block; image-rendering:pixelated; cursor:grab; }
#view.held { cursor:grabbing; }
#bar { position:fixed; left:0; right:0; top:0; z-index:5; display:flex; flex-wrap:wrap; gap:4px 8px; align-items:center; padding:max(6px,env(safe-area-inset-top)) 10px 6px; background:rgba(16,38,28,.88); border-bottom:1px solid var(--line); }
#bar b { font-size:14px; } .dim { color:var(--dim); font-size:12px; }
.btn { font:inherit; font-size:12px; padding:3px 10px; border:1px solid var(--line); border-radius:999px; background:#1d3d2c; color:var(--ink); cursor:pointer; text-decoration:none; white-space:nowrap; }
.btn:active { background:#2b5a40; } .btn[disabled] { opacity:.45; cursor:default; }
.btn.gold { border-color:#8a6a1f; background:#4a3a12; color:var(--gold); }
#card { position:fixed; left:10px; bottom:calc(10px + env(safe-area-inset-bottom)); z-index:6; background:rgba(16,38,28,.92); border:1px solid var(--line); border-radius:12px; padding:6px 12px; display:none; }
#card b { font-size:15px; }
#tip { position:fixed; left:50%; bottom:calc(14px + env(safe-area-inset-bottom)); transform:translateX(-50%); z-index:6; background:rgba(16,38,28,.92); border:1px solid var(--line); border-radius:999px; padding:6px 14px; font-size:12px; transition:opacity .6s; pointer-events:none; white-space:nowrap; max-width:96vw; overflow:hidden; text-overflow:ellipsis; }
#me { position:fixed; right:8px; top:calc(var(--barH, 40px) + 8px); z-index:6; width:min(300px, calc(100vw - 16px)); max-height:calc(100dvh - var(--barH, 40px) - 24px); overflow:auto; background:rgba(16,38,28,.94); border:1px solid var(--line); border-radius:14px; padding:10px 12px; display:none; }
#me h3 { margin:0 0 6px; font-size:14px; } #me .row { display:flex; align-items:center; justify-content:space-between; gap:8px; margin:3px 0; }
#me .stat { display:grid; grid-template-columns: 44px 1fr 28px; gap:6px; align-items:center; margin:2px 0; font-size:12px; }
#me .bar { height:6px; background:#1a3326; border-radius:3px; overflow:hidden; } #me .bar i { display:block; height:100%; background:#7fd47a; }
#me .rw { border-top:1px solid var(--line); margin-top:8px; padding-top:6px; }
#me .nit { font-size:18px; font-weight:700; color:var(--gold); }
#me .msg { font-size:12px; color:var(--dim); min-height:16px; }
@media (max-width: 560px) { .wide { display:none; } #fps { display:none; } }
.btn.big { font-size:14px; padding:6px 14px; } .btn.red { border-color:#7a3a3a; background:#4a1c1c; color:#ffb0a0; }
#act { position:fixed; left:50%; transform:translateX(-50%); bottom:calc(56px + env(safe-area-inset-bottom)); z-index:7; display:none; gap:8px; align-items:center; background:rgba(16,38,28,.95); border:1px solid var(--line); border-radius:999px; padding:6px 8px 6px 14px; font-size:12px; max-width:96vw; white-space:nowrap; }
#act.show { display:flex; } #act .lab { overflow:hidden; text-overflow:ellipsis; max-width:46vw; }
#toast { position:fixed; left:50%; top:calc(var(--barH, 40px) + 10px); transform:translateX(-50%); z-index:9; background:rgba(16,38,28,.95); border:1px solid #8a6a1f; color:var(--gold); border-radius:999px; padding:6px 14px; font-size:13px; opacity:0; transition:opacity .35s; pointer-events:none; max-width:94vw; text-align:center; }
#toast.show { opacity:1; }
#mk { position:fixed; right:8px; top:calc(var(--barH, 40px) + 8px); z-index:6; width:min(320px, calc(100vw - 16px)); max-height:calc(100dvh - var(--barH, 40px) - 24px); overflow:auto; background:rgba(16,38,28,.95); border:1px solid var(--line); border-radius:14px; padding:10px 12px; display:none; }
#mk h3 { margin:0 0 6px; font-size:14px; } #mk .tabs { display:flex; gap:4px; margin-bottom:8px; } #mk .tabs .btn.on { background:#2b5a40; border-color:#5a9a70; }
#mk .row { display:flex; align-items:center; justify-content:space-between; gap:8px; margin:4px 0; } #mk .inv { display:grid; grid-template-columns:repeat(4,1fr); gap:4px; text-align:center; margin-bottom:6px; }
#mk .inv div { background:#1a3326; border-radius:8px; padding:4px 2px; font-size:12px; } #mk .inv b { display:block; font-size:15px; color:var(--gold); }
#mk .msg { font-size:12px; color:var(--dim); min-height:16px; margin-top:6px; } #mk .sub { font-size:11px; color:var(--dim); }
#chat { position:fixed; left:50%; transform:translateX(-50%); bottom:calc(10px + env(safe-area-inset-bottom)); z-index:8; display:none; width:min(420px, calc(100vw - 16px)); background:rgba(16,38,28,.96); border:1px solid var(--line); border-radius:14px; padding:8px; }
#chat.show { display:block; } #chat .r { display:flex; gap:6px; margin-top:6px; } #chat .r:first-child { margin-top:0; }
#chat input { flex:1; min-width:0; font:inherit; font-size:14px; padding:6px 10px; border-radius:999px; border:1px solid var(--line); background:#0d1d15; color:var(--ink); }
#bw { position:fixed; inset:0; z-index:10; display:none; align-items:center; justify-content:center; background:rgba(0,0,0,.45); } #bw.show { display:flex; }
#bw .box { width:min(360px, calc(100vw - 24px)); max-height:80dvh; overflow:auto; background:#16301f; border:2px solid #8a5a2a; border-radius:12px; padding:12px 14px; }
#bw h3 { margin:0 0 6px; font-size:15px; } #bw .it { padding:4px 0; border-top:1px dashed var(--line); font-size:12.5px; } #bw .it .dim { margin-left:6px; }
#photoBar { position:fixed; left:50%; transform:translateX(-50%); bottom:calc(14px + env(safe-area-inset-bottom)); z-index:8; display:none; gap:8px; }
body.photo #photoBar { display:flex; } body.photo #bar, body.photo #me, body.photo #mk, body.photo #card, body.photo #tip, body.photo #act, body.photo #chat, body.photo #gver, body.photo #bw { display:none !important; }
#gver { position:fixed; right:8px; bottom:calc(2px + env(safe-area-inset-bottom)); z-index:3; font-size:10px; color:var(--dim); opacity:.55; pointer-events:none; }
</style></head><body>

  <a class="btn" id="lkHome" href="../" style="display:none">← 잠만보</a>

  <a class="btn" id="lkLogin" href="../" style="display:none">🔑 <span class="wide">로그인</span></a>
