<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="합성 카메라">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="icon" href="data:,">
<title>합성 카메라 (시험)</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; background: #000; color: #f2f4f6; overscroll-behavior: none; font: 15px/1.5 system-ui, -apple-system, "Malgun Gothic", sans-serif; }
  button, select { font: inherit; color: inherit; }
  .hide { display: none !important; }

  /* ----- 카메라 화면 ----- */
  #cam { position: fixed; inset: 0; display: flex; flex-direction: column; background: #000; user-select: none; -webkit-user-select: none; }
  #top { display: flex; align-items: center; gap: 6px; padding: calc(6px + env(safe-area-inset-top)) 10px 6px; min-height: 48px; }
  #top .sp { flex: 1; text-align: center; font-size: 12px; color: #aab4be; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ic { width: 42px; height: 42px; border-radius: 50%; border: 0; background: transparent; font-size: 20px; line-height: 1; cursor: pointer; }
  .ic.on { background: #ffd43b; color: #000; }
  #vf { flex: 1; position: relative; overflow: hidden; touch-action: none; background: #000; }
  #v { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; transform-origin: 50% 50%; }
  #msg { position: absolute; left: 12px; right: 12px; top: 12px; text-align: center; font-size: 14px; text-shadow: 0 1px 3px #000; pointer-events: none; }
  #big { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; background: rgba(0, 0, 0, .35); font-size: 22px; font-weight: 700; text-shadow: 0 1px 4px #000; pointer-events: none; }
  #big small { font-size: 14px; font-weight: 400; }
  #bar { width: 60%; height: 6px; background: rgba(255, 255, 255, .25); border-radius: 3px; overflow: hidden; }
  #bar i { display: block; height: 100%; width: 0; background: #fff; }
  #startBox { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 24px; text-align: center; }
  #startBox button { background: #2f7de1; border: 0; border-radius: 24px; padding: 12px 22px; font-weight: 700; cursor: pointer; }
  #zoomBox { padding: 6px 12px 2px; }
  #chips { display: flex; justify-content: center; gap: 8px; }
  #chips button { min-width: 44px; height: 34px; padding: 0 10px; border-radius: 17px; border: 0; background: rgba(255, 255, 255, .14); font-size: 13px; cursor: pointer; }
  #chips button.on { background: #fff; color: #000; font-weight: 700; }
  #slZoom { width: 100%; margin: 8px 0 0; }
  #bot { display: flex; align-items: center; justify-content: space-around; padding: 10px 18px calc(16px + env(safe-area-inset-bottom)); }
  #thumb { width: 52px; height: 52px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, .5); background: #222 center/cover no-repeat; cursor: pointer; font-size: 20px; }
  #shut { width: 76px; height: 76px; border-radius: 50%; border: 4px solid #fff; background: transparent; padding: 0; cursor: pointer; position: relative; }
  #shut::after { content: ''; position: absolute; inset: 5px; border-radius: 50%; background: #fff; transition: transform .1s; }
  #shut:active::after { transform: scale(.88); }
  #shut:disabled { opacity: .4; }
  #flip { width: 52px; height: 52px; border-radius: 50%; border: 0; background: rgba(255, 255, 255, .14); font-size: 22px; cursor: pointer; }
  #flip:disabled { opacity: .35; }

  /* ----- 설정 ----- */
  #set { position: fixed; inset: 0; background: rgba(0, 0, 0, .6); display: flex; align-items: flex-end; z-index: 5; }
  #set .sheet { width: 100%; max-width: 640px; margin: 0 auto; background: #182028; border-radius: 16px 16px 0 0; padding: 14px 14px calc(18px + env(safe-area-inset-bottom)); }
  #set h2 { font-size: 16px; margin: 0 0 6px; }
  #set label { display: block; font-size: 12px; color: #9aa7b4; margin-top: 10px; }
  #set select, .wide { width: 100%; background: #26323e; border: 1px solid #3a4a5a; border-radius: 8px; padding: 10px; min-height: 44px; display: block; text-align: center; cursor: pointer; }
  #set p { font-size: 12px; color: #9aa7b4; margin: 12px 0 0; }

  /* ----- 결과 화면 ----- */
  #res { position: fixed; inset: 0; overflow: auto; background: #101418; padding: calc(8px + env(safe-area-inset-top)) 10px calc(24px + env(safe-area-inset-bottom)); z-index: 4; }
  #res .in { max-width: 760px; margin: 0 auto; }
  #wrap { overflow: auto; max-height: 68vh; border-radius: 8px; background: #000; }
  #out { display: block; width: 100%; height: auto; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .row button { flex: 1 1 auto; background: #26323e; border: 1px solid #3a4a5a; border-radius: 8px; padding: 9px 10px; min-height: 44px; cursor: pointer; }
  .row button.primary { background: #2f7de1; border-color: #2f7de1; font-weight: 700; }
  .row button.on { background: #b9651b; border-color: #b9651b; }
  .sl { display: grid; grid-template-columns: 96px 1fr 46px; gap: 8px; align-items: center; margin-top: 10px; font-size: 13px; }
  .sl input { width: 100%; }
  #log { white-space: pre-wrap; font: 12px/1.5 ui-monospace, Consolas, monospace; color: #9aa7b4; margin: 10px 0 0; }
</style>
</head>
<body>
<div id="cam">
  <div id="top">
    <button class="ic" id="btnSet" aria-label="설정">⚙</button>
    <button class="ic hide" id="btnTorch" aria-label="조명">⚡</button>
    <div class="sp" id="info"></div>
    <button class="ic" id="btnHelp" aria-label="도움말">?</button>
  </div>
  <div id="vf">
    <video id="v" playsinline muted autoplay></video>
    <div id="msg"></div>
    <div id="big" class="hide"><span id="bigT"></span><div id="bar"><i></i></div><small id="bigS"></small></div>
    <div id="startBox" class="hide"><div id="startT"></div><button id="btnCam">카메라 켜기</button></div>
  </div>
  <div id="zoomBox">
    <div id="chips"></div>
    <input id="slZoom" type="range" min="1" max="4" step="0.1" value="1" aria-label="줌">
  </div>
  <div id="bot">
    <button id="thumb" aria-label="마지막 결과">🖼</button>
    <button id="shut" aria-label="찍기" disabled></button>
    <button id="flip" aria-label="렌즈 바꾸기" disabled>🔄</button>
  </div>
</div>

<div id="set" class="hide">
  <div class="sheet">
    <h2>설정</h2>
    <label>렌즈 (카메라)<select id="selCam"></select></label>
    <label>찍을 장수<select id="selN"><option>8</option><option selected>16</option><option>24</option><option>32</option></select></label>
    <label>출력 크기<select id="selS"><option value="1">1배 (잡음만 줄임)</option><option value="1.5">1.5배</option><option value="2" selected>2배 (해상도 올림)</option></select></label>
    <label>카메라 해상도<select id="selR"><option value="1920x1080" selected>FHD</option><option value="3840x2160">최대 (느림)</option><option value="1280x720">HD (빠름)</option></select></label>
    <label>이미 찍어 둔 사진으로<span class="wide" style="margin-top:4px;color:#f2f4f6;font-size:15px">사진 여러 장 골라 합성<input id="file" type="file" accept="image/*" multiple class="hide"></span></label>
    <p id="ver"></p>
    <div class="row"><button id="btnSetX" class="primary">닫기</button></div>
  </div>
</div>

<div id="res" class="hide">
  <div class="in">
    <div class="row" style="margin-top:0"><button id="btnBack">← 카메라</button><button id="btnSave" class="primary">저장</button></div>
    <div id="wrap" style="margin-top:8px"><canvas id="out"></canvas></div>
    <div class="row">
      <button id="btnCmp">원본 1장 보기</button>
      <button id="btnZoom">확대</button>
    </div>
    <div class="sl"><span>밝기</span><input id="slEv" type="range" min="-1" max="3" step="0.1" value="0"><span id="vEv">0</span></div>
    <div class="sl"><span>어두운 곳 밝게</span><input id="slSh" type="range" min="0" max="1.5" step="0.05" value="0"><span id="vSh">0</span></div>
    <div class="sl"><span>선명도</span><input id="slUs" type="range" min="0" max="2" step="0.05" value="0.5"><span id="vUs">0.5</span></div>
    <pre id="log"></pre>
  </div>
</div>

<script src="stack.js?v=0.2.0"></script>
<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var video = $('v'), out = $('out'), octx = out.getContext('2d', { willReadFrequently: true });
  var stream = null, track = null, cams = [], curDev = '', hwZoom = false, dz = 1, zoomBusy = false, zoomNext = null, torch = false;
  var busy = false, A = null, outImg = null, refBmp = null, cmp = false, zoom = false, starting = null;
  $('ver').textContent = 'v' + Stack.VER + ' · 계산은 모두 이 기기 안에서 하고 사진은 어디에도 보내지 않습니다.';

  function msg(t) { $('msg').textContent = t || ''; }
  function big(t, p, s) {   // 가운데 큰 안내 (찍는 중 · 합성 중). t 가 없으면 숨김
    $('big').classList.toggle('hide', !t); if (!t) return;
    $('bigT').textContent = t; $('bigS').textContent = s || ''; $('bar').firstChild.style.width = Math.round((p || 0) * 100) + '%';
  }
  function log(t) { $('log').textContent += t + '\n'; }
  function tick() { return new Promise(function (r) { setTimeout(r, 0); }); }
  function setBusy(b) {
    busy = b; $('shut').disabled = b || !stream; $('flip').disabled = b || cams.length < 2; $('btnSet').disabled = b; $('slZoom').disabled = b;
    Array.prototype.forEach.call($('chips').children, function (c) { c.disabled = b; });
  }

  /* ----- 카메라 ----- */
  function stopCam() { if (stream) stream.getTracks().forEach(function (t) { t.stop(); }); stream = null; track = null; }
  function needStart(t) { $('startT').textContent = t; $('startBox').classList.remove('hide'); $('shut').disabled = true; }
  function startCam(devId) {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { needStart('이 브라우저에서는 카메라를 쓸 수 없어요. https 주소로, 카톡 안 브라우저 말고 크롬 · 사파리로 열어 주세요. (⚙ 설정의 사진 파일 고르기는 됩니다)'); $('btnCam').classList.add('hide'); return Promise.resolve(); }
    if (starting) return starting;
    stopCam();
    var r = $('selR').value.split('x'), vc = { width: { ideal: +r[0] }, height: { ideal: +r[1] } };
    if (typeof devId !== 'string') devId = curDev;
    if (devId) vc.deviceId = { exact: devId }; else vc.facingMode = { ideal: 'environment' };
    msg('카메라 여는 중…');
    starting = navigator.mediaDevices.getUserMedia({ audio: false, video: vc }).then(function (s) {
      stream = s; track = s.getVideoTracks()[0]; video.srcObject = s; $('startBox').classList.add('hide');
      return video.play().catch(function () {});
    }).then(function () {
      return new Promise(function (res) { if (video.videoWidth) res(); else video.onloadedmetadata = function () { res(); }; });
    }).then(function () {
      torch = false; setupZoom(); setupTorch();
      $('info').textContent = video.videoWidth + '×' + video.videoHeight + ' · ' + $('selN').value + '장 · ' + $('selS').value + '배';
      msg(''); setBusy(busy);
      return listCams();
    }).catch(function (e) {
      stream = null; track = null; curDev = ''; msg('');
      needStart(e && e.name === 'NotAllowedError' ? '카메라 권한을 허용해 주세요' : '카메라를 못 열었어요: ' + ((e && e.message) || e));
    }).then(function () { starting = null; });
    return starting;
  }
  /* 렌즈 목록 — 권한을 받은 뒤에야 이름이 보임. 폰 · 브라우저에 따라 뒤쪽 렌즈가 하나만 나오기도 함 */
  function listCams() {
    if (!navigator.mediaDevices.enumerateDevices) return;
    return navigator.mediaDevices.enumerateDevices().then(function (ds) {
      var sel = $('selCam'), cur = track && track.getSettings ? track.getSettings().deviceId : '';
      cams = ds.filter(function (d) { return d.kind === 'videoinput'; });
      sel.innerHTML = '';
      cams.forEach(function (d, i) { var o = document.createElement('option'); o.value = d.deviceId; o.textContent = d.label || ('카메라 ' + (i + 1)); if (d.deviceId === cur) o.selected = true; sel.appendChild(o); });
      if (cur) curDev = cur;
      $('flip').disabled = busy || cams.length < 2;
    }).catch(function () {});
  }
  function nextCam() {
    if (busy || cams.length < 2) return;
    var i = 0, k; for (k = 0; k < cams.length; k++) if (cams[k].deviceId === curDev) i = k;
    curDev = cams[(i + 1) % cams.length].deviceId;
    startCam(curDev).then(function () { var o = $('selCam').selectedOptions[0]; if (o && stream) { msg(o.textContent); setTimeout(function () { if (!busy) msg(''); }, 1800); } });
  }
  /* 줌 — 카메라가 줌을 지원하면(안드로이드 크롬 등) 카메라 줌, 아니면 가운데를 잘라 키우는 디지털 줌. 어느 쪽이든 미리보기에 바로 보임 */
  function setupZoom() {
    var caps = track && track.getCapabilities ? track.getCapabilities() : {}, sl = $('slZoom'), st = track && track.getSettings ? track.getSettings() : {};
    hwZoom = !!(caps.zoom && caps.zoom.max > caps.zoom.min);
    dz = 1; video.style.transform = '';
    if (hwZoom) { sl.min = caps.zoom.min; sl.max = caps.zoom.max; sl.step = caps.zoom.step || 0.1; sl.value = st.zoom || Math.max(1, caps.zoom.min); }
    else { sl.min = 1; sl.max = 4; sl.step = 0.1; sl.value = 1; }
    var lo = +sl.min, hi = +sl.max, list = (lo < 0.95 ? [lo] : []).concat([1, 2, 3, 5, 10].filter(function (v) { return v >= lo - 1e-6 && v <= hi + 1e-6; }));
    $('chips').innerHTML = '';
    list.forEach(function (v) {
      var b = document.createElement('button'); b.setAttribute('data-z', v); b.textContent = (v < 1 ? v.toFixed(1).replace(/^0/, '') : v) + '×';
      b.onclick = function () { if (busy) return; sl.value = v; applyZoom(); };
      $('chips').appendChild(b);
    });
    showZoom();
  }
  function showZoom() {
    var v = +$('slZoom').value, best = null, bd = 1e9;
    Array.prototype.forEach.call($('chips').children, function (c) { var d = Math.abs(+c.getAttribute('data-z') - v); c.classList.remove('on'); c.textContent = c.textContent.replace(/^.*×/, (+c.getAttribute('data-z') < 1 ? (+c.getAttribute('data-z')).toFixed(1).replace(/^0/, '') : c.getAttribute('data-z')) + '×'); if (d < bd) { bd = d; best = c; } });
    if (best) { best.classList.add('on'); if (bd > 0.049) best.textContent = v.toFixed(1) + '×'; }   // 사이 값이면 가까운 단추에 지금 배율을 보여 줌
  }
  function applyZoom() {
    var v = +$('slZoom').value; showZoom();
    if (!hwZoom) { dz = v; video.style.transform = v > 1 ? 'scale(' + v + ')' : ''; return; }
    if (zoomBusy) { zoomNext = v; return; }   // 카메라가 앞의 값을 적용하는 중이면 마지막 값만 기억
    zoomBusy = true;
    track.applyConstraints({ advanced: [{ zoom: v }] }).catch(function () {}).then(function () {
      zoomBusy = false; if (zoomNext != null) { zoomNext = null; if (track) applyZoom(); }
    });
  }
  // 두 손가락으로 미리보기를 벌리거나 오므려도 줌
  (function () {
    var d0 = 0, z0 = 1;
    function dist(e) { return Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY); }
    $('vf').addEventListener('touchstart', function (e) { if (e.touches.length === 2) { d0 = dist(e); z0 = +$('slZoom').value; } }, { passive: true });
    $('vf').addEventListener('touchmove', function (e) {
      if (e.touches.length !== 2 || !d0 || busy || !stream) return;
      var sl = $('slZoom'); sl.value = Math.max(+sl.min, Math.min(+sl.max, z0 * dist(e) / d0)); applyZoom();
    }, { passive: true });
    $('vf').addEventListener('touchend', function () { d0 = 0; }, { passive: true });
  })();
  // 조명(손전등) — 지원하는 카메라에서만 단추가 보임
  function setupTorch() {
    var caps = track && track.getCapabilities ? track.getCapabilities() : {};
    $('btnTorch').classList.toggle('hide', !caps.torch); $('btnTorch').classList.remove('on');
  }
  $('btnTorch').onclick = function () {
    if (!track || busy) return;
    var want = !torch, b = this;
    track.applyConstraints({ advanced: [{ torch: want }] }).then(function () { torch = want; b.classList.toggle('on', torch); }, function () {});
  };

  function nextVideoFrame() {
    return new Promise(function (r) { if (video.requestVideoFrameCallback) video.requestVideoFrameCallback(function () { r(); }); else setTimeout(r, 70); });
  }
  function grab(src, sx, sy, w, h) {   // 그 순간의 그림을 따로 떼어 둠 (디지털 줌이면 가운데 w×h 만)
    if (window.createImageBitmap) return createImageBitmap(src, sx, sy, w, h);
    var c = document.createElement('canvas'); c.width = w; c.height = h; c.getContext('2d').drawImage(src, sx, sy, w, h, 0, 0, w, h); return Promise.resolve(c);
  }
  function shoot() {
    if (busy || !stream) return;
    var vw0 = video.videoWidth, vh0 = video.videoHeight, w = Math.max(64, Math.round(vw0 / dz / 2) * 2), h = Math.max(64, Math.round(vh0 / dz / 2) * 2), sx = (vw0 - w) >> 1, sy = (vh0 - h) >> 1, n = +$('selN').value, frames = [];
    var maxN = Math.max(4, Math.floor(420e6 / (w * h * 4)));   // 찍어 둔 사진이 메모리를 너무 쓰지 않게
    if (n > maxN) n = maxN;
    setBusy(true); big('가만히…', 0, '0 / ' + n);
    var i = 0;
    function one() {
      if (i >= n) return Promise.resolve();
      return nextVideoFrame().then(function () { return grab(video, sx, sy, w, h); }).then(function (b) { frames.push(b); i++; big('가만히…', i / n * 0.15, i + ' / ' + n); return one(); });
    }
    one().then(function () { return process(frames, w, h); }).catch(fail).then(function () { setBusy(false); });
  }
  function fail(e) { console.error(e); big(''); msg('실패: ' + ((e && e.message) || e) + ' — ⚙ 에서 장수 · 출력 크기를 줄여 다시 해 보세요'); }

  /* ----- 사진 파일 ----- */
  function loadFiles(files) {
    if (busy || !files.length) return;
    $('set').classList.add('hide');
    if (files.length < 2) { msg('같은 곳을 찍은 사진을 2장 이상 골라 주세요'); return; }
    setBusy(true); big('사진 읽는 중…', 0);
    var list = Array.prototype.slice.call(files, 0, 32), bmps = [];
    list.reduce(function (p, f) {
      return p.then(function () { return window.createImageBitmap ? createImageBitmap(f) : loadImg(f); }).then(function (b) { bmps.push(b); });
    }, Promise.resolve()).then(function () {
      var w = bmps[0].width, h = bmps[0].height, k = Math.min(1, 2560 / Math.max(w, h));   // 긴 변 2560 까지
      w = Math.round(w * k); h = Math.round(h * k);
      return process(bmps, w, h);
    }).catch(fail).then(function () { setBusy(false); $('file').value = ''; });
  }
  function loadImg(f) { return new Promise(function (res, rej) { var im = new Image(); im.onload = function () { res(im); }; im.onerror = function () { rej(new Error('사진을 못 읽음')); }; im.src = URL.createObjectURL(f); }); }

  /* ----- 합성 ----- */
  function process(frames, w, h) {
    var n = frames.length, t0 = Date.now(), work = document.createElement('canvas'), wctx, sm = document.createElement('canvas'), sctx;
    work.width = w; work.height = h; wctx = work.getContext('2d', { willReadFrequently: true });
    sm.width = 256; sm.height = Math.max(8, Math.round(256 * h / w)); sctx = sm.getContext('2d', { willReadFrequently: true });
    function pixels(b) { wctx.drawImage(b, 0, 0, w, h); return wctx.getImageData(0, 0, w, h).data; }
    $('log').textContent = ''; cmp = false; $('btnCmp').classList.remove('on'); $('btnCmp').textContent = '원본 1장 보기';
    if (refBmp && refBmp.close) refBmp.close();
    A = null; outImg = null; refBmp = null;

    // 1) 가장 또렷한 사진을 기준으로
    var sharp = frames.map(function (b) { sctx.drawImage(b, 0, 0, sm.width, sm.height); return Stack.sharpness(sctx.getImageData(0, 0, sm.width, sm.height).data, sm.width, sm.height); });
    var ri = 0, i; for (i = 1; i < n; i++) if (sharp[i] > sharp[ri]) ri = i;
    var scale = Math.max(1, Math.min(+$('selS').value, Math.floor(Math.sqrt(12e6 / (w * h)) * 100) / 100));   // 결과는 1,200만 화소까지
    var ref, used = 0, order = [];
    for (i = 0; i < n; i++) if (i !== ri) order.push(i);
    big('합성 중…', 0.15, '1 / ' + n);
    return tick().then(function () {
      var px = pixels(frames[ri]);
      ref = Stack.prepareRef(px, w, h); A = Stack.createAcc(ref, scale); Stack.accumulate(A, ref, px, null, 1);
      refBmp = frames[ri];
      log('사진 ' + n + '장 · ' + w + '×' + h + ' → ' + A.W + '×' + A.H + ' (' + scale + '배) · 기준 = ' + (ri + 1) + '번째 · 잡음 ' + ref.sigma.toFixed(1) + (dz > 1 && stream ? ' · 디지털 줌 ' + dz.toFixed(1) + '×' : ''));
      var k = 0;
      function step() {
        if (k >= order.length) return Promise.resolve();
        var idx = order[k++];
        big('합성 중…', 0.15 + 0.8 * k / order.length, (k + 1) + ' / ' + n);
        return tick().then(function () {
          var px = pixels(frames[idx]), al = Stack.alignFrame(ref, px), fw = Math.max(0.2, Math.min(1, sharp[idx] / sharp[ri]));
          var u = Stack.accumulate(A, ref, px, al, fw); used += u * fw;
          log((idx + 1 < 10 ? ' ' : '') + (idx + 1) + '번: 이동 ' + al.medx.toFixed(2) + ', ' + al.medy.toFixed(2) + 'px · 쓰인 비율 ' + Math.round(u * 100) + '% · 또렷함 ' + Math.round(fw * 100) + '% · 맞춘 칸 ' + Math.round(al.relFrac * 100) + '%');
          if (frames[idx].close) frames[idx].close();
          return step();
        });
      }
      return step();
    }).then(function () {
      big('마무리 중…', 0.97); return tick();
    }).then(function () {
      Stack.finish(A);
      out.width = A.W; out.height = A.H; outImg = octx.createImageData(A.W, A.H);
      draw();
      var eff = 1 + used;
      log('사진 ' + eff.toFixed(1) + '장 분량이 합쳐짐 → 잡음 약 1/' + Math.sqrt(eff).toFixed(1) + ' (노출을 ' + eff.toFixed(1) + '배 길게 한 효과) · ' + ((Date.now() - t0) / 1000).toFixed(1) + '초');
      big(''); msg(''); setThumb(); showRes(true);
    });
  }
  function setThumb() {   // 왼쪽 아래 동그라미에 방금 결과
    try { var c = document.createElement('canvas'), k = 104 / Math.min(out.width, out.height); c.width = 104; c.height = 104;
      c.getContext('2d').drawImage(out, (out.width - 104 / k) / 2, (out.height - 104 / k) / 2, 104 / k, 104 / k, 0, 0, 104, 104);
      $('thumb').style.backgroundImage = 'url(' + c.toDataURL('image/jpeg', 0.7) + ')'; $('thumb').textContent = ''; } catch (e) {}
  }
  function showRes(on) { $('res').classList.toggle('hide', !on); if (on) $('res').scrollTop = 0; }
  function opt() { return { ev: +$('slEv').value, shadows: +$('slSh').value, sharp: +$('slUs').value }; }
  function draw() {
    if (!A || !outImg) return;
    if (cmp) {   // 기준 사진 한 장을 같은 크기로 키우고 같은 밝기만 입힘
      octx.imageSmoothingEnabled = true; octx.imageSmoothingQuality = 'high'; octx.drawImage(refBmp, 0, 0, A.W, A.H);
      var id = octx.getImageData(0, 0, A.W, A.H); Stack.tone(id.data, opt()); octx.putImageData(id, 0, 0);
    } else { Stack.render(A, outImg.data, opt()); octx.putImageData(outImg, 0, 0); }
  }
  ['slEv', 'slSh', 'slUs'].forEach(function (id) {
    var lab = { slEv: 'vEv', slSh: 'vSh', slUs: 'vUs' }[id];
    $(id).addEventListener('input', function () { $(lab).textContent = (id === 'slEv' && +this.value > 0 ? '+' : '') + this.value; });
    $(id).addEventListener('change', draw);
  });
  $('btnCmp').onclick = function () { cmp = !cmp; this.classList.toggle('on', cmp); this.textContent = cmp ? '합성 결과 보기 (지금: 원본 1장)' : '원본 1장 보기'; draw(); };
  $('btnZoom').onclick = function () {
    zoom = !zoom; this.classList.toggle('on', zoom); this.textContent = zoom ? '화면에 맞추기' : '확대';
    out.style.width = zoom ? Math.round(out.width * 2 / (window.devicePixelRatio || 1)) + 'px' : '100%';   // 사진 1픽셀 = 화면 2픽셀
  };
  $('btnSave').onclick = function () {
    out.toBlob(function (b) {
      if (!b) { log('저장 실패'); return; }
      var d = new Date(), p = function (v) { return (v < 10 ? '0' : '') + v; }, a = document.createElement('a');
      a.href = URL.createObjectURL(b); a.download = 'stack_' + d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + '_' + p(d.getHours()) + p(d.getMinutes()) + p(d.getSeconds()) + (cmp ? '_1장' : '') + '.jpg';
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(function () { URL.revokeObjectURL(a.href); }, 20000);
    }, 'image/jpeg', 0.95);
  };
  $('btnBack').onclick = function () { showRes(false); };
  $('thumb').onclick = function () { if (busy) return; if (A && outImg) showRes(true); else msg('아직 찍은 사진이 없어요'); };
  $('btnCam').onclick = function () { startCam(); };
  $('shut').onclick = shoot;
  $('flip').onclick = nextCam;
  $('btnSet').onclick = function () { if (!busy) $('set').classList.remove('hide'); };
  $('btnSetX').onclick = function () { $('set').classList.add('hide'); };
  $('set').onclick = function (e) { if (e.target === this) this.classList.add('hide'); };
  $('btnHelp').onclick = function () { msg('같은 곳을 연달아 여러 장 찍어 한 장으로 합칩니다 — 잡음이 줄고 해상도가 올라요. 찍는 동안 폰을 가만히, 움직이지 않는 대상으로.'); setTimeout(function () { if (!busy) msg(''); }, 6000); };
  $('selR').onchange = function () { if (!busy) startCam(); };
  $('selCam').onchange = function () { if (!busy) { curDev = this.value; startCam(curDev); } };
  $('selN').onchange = $('selS').onchange = function () { if (stream) $('info').textContent = video.videoWidth + '×' + video.videoHeight + ' · ' + $('selN').value + '장 · ' + $('selS').value + '배'; };
  $('slZoom').addEventListener('input', applyZoom);
  $('file').onchange = function () { loadFiles(this.files); };
  // 다른 앱으로 가면 카메라를 놓고, 돌아오면 다시 켬 (카메라 앱처럼)
  document.addEventListener('visibilitychange', function () {
    if (busy) return;
    if (document.hidden) stopCam(); else if (!stream) startCam();
  });
  window.addEventListener('pagehide', stopCam);
  startCam();
})();
</script>
</body>
</html>
