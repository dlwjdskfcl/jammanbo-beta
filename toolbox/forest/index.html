          for (var r = 0; r <= tr[1]; r++) { var hw = Math.round(tr[2] * r / tr[1]) + 1; rect(q, 20 - hw, tr[0] + r, hw * 2 + 1, 1, '#276b3c'); rect(q, 20 - hw, tr[0] + r, Math.max(1, Math.round(hw * .8)), 1, '#2f8247'); if (r % 3 === 0) px(q, 20 - hw + 1, tr[0] + r, '#46a35a'); px(q, 20 + hw, tr[0] + r, '#1e5530'); }

      blobs.forEach(function (b) { disc(q, b[0], b[1], b[2], dk); });

      [[17, 12, 7], [10, 21, 5], [24, 10, 5]].forEach(function (b) { disc(q, b[0], b[1], b[2], lt); });
      for (var k = 0; k < 26; k++) px(q, 8 + Math.floor(rr() * 24), 5 + Math.floor(rr() * 20), hi);
      for (k = 0; k < 14; k++) px(q, 6 + Math.floor(rr() * 28), 10 + Math.floor(rr() * 22), dk);
    });
  }
  function getObj(o) {
    var key = o.kind + (o.kind === 'round' || o.kind === 'pink' || o.kind === 'pine' ? ':' + (o.seed % 5) : o.kind === 'flower' ? ':' + o.v : '');

    if (o.kind === 'round' || o.kind === 'pink' || o.kind === 'pine') c = mkTree(o.kind, o.seed % 5 + 11);
    else if (o.kind === 'bush') c = sprite(20, 12, function (q) { disc(q, 10, 7, 5, '#3f9a45'); disc(q, 5, 8, 4, '#3f9a45'); disc(q, 15, 8, 4, '#3f9a45'); disc(q, 9, 5, 3, '#5cb857'); disc(q, 5, 7, 2, '#5cb857'); px(q, 12, 4, '#86d36a'); rect(q, 3, 10, 14, 1, '#2f7a3a'); });
    else if (o.kind === 'rock') c = sprite(16, 14, function (q) { disc(q, 8, 8, 5, '#62666d'); disc(q, 8, 7, 5, '#8d9097'); disc(q, 6, 5, 3, '#b4b8be'); rect(q, 3, 12, 10, 1, '#62666d'); });
    else if (o.kind === 'log') c = sprite(34, 16, function (q) { rect(q, 3, 3, 28, 11, '#8a5a2a'); rect(q, 3, 3, 28, 3, '#a8743a'); rect(q, 3, 11, 28, 3, '#6b4a2b'); for (var k = 0; k < 6; k++) px(q, 7 + k * 4, 6 + (k % 3), '#6b4a2b'); disc(q, 4, 8, 5, '#c4934e'); disc(q, 4, 8, 3, '#a8743a'); disc(q, 4, 8, 1, '#c4934e'); q.fillStyle = 'rgba(30,60,30,.28)'; q.fillRect(4, 14, 28, 2); });
    else if (o.kind === 'stump') c = sprite(18, 16, function (q) { rect(q, 3, 5, 12, 9, '#8a5a2a'); rect(q, 3, 5, 3, 9, '#a8743a'); rect(q, 12, 5, 3, 9, '#6b4a2b'); disc(q, 9, 5, 6, '#c4934e'); disc(q, 9, 5, 4, '#a8743a'); disc(q, 9, 5, 2, '#c4934e'); });
    else c = sprite(7, 9, function (q) { var col = ['#ff6fa8', '#ffd23f', '#ffffff', '#9a86ff', '#ff8a3d', '#ffb3d0'][o.v]; px(q, 3, 8, '#3f9a45'); px(q, 3, 7, '#3f9a45'); px(q, 3, 6, '#3f9a45'); rect(q, 2, 3, 3, 3, col); px(q, 3, 4, '#ffe27a'); px(q, 3, 2, col); px(q, 1, 4, col); px(q, 5, 4, col); });
    cache[key] = c; return c;
  }

  objs = objs.filter(function (o) {   // 꽃은 땅에 붙은 장식이라 땅 그림에 미리 구움 (매 프레임 그리지 않음)
    if (o.kind !== 'flower') return true;
    var im = getObj(o); g.drawImage(im, Math.round(o.tx * T + 8 - im.width / 2 + o.ox), Math.round(o.by - im.height)); return false;
  });
  objs.sort(function (a, b) { return a.by - b.by; });   // 나무·바위 등은 위치가 안 변하므로 한 번만 정렬

  // ---------- 캐릭터 ----------
  var chars = [], walk = [];
  for (y = 0; y < H; y++) { walk.push([]); for (x = 0; x < W; x++) walk[y].push((terr[y][x] === G || terr[y][x] === P || terr[y][x] === BR) && !blocked[x + ',' + y]); }
  function bfs(sx, sy, maxd) {
    var dist = {}, prev = {}, q = [[sx, sy]]; dist[sx + ',' + sy] = 0;
    for (var qi = 0; qi < q.length; qi++) { var c = q[qi], d = dist[c[0] + ',' + c[1]]; if (d >= maxd) continue;
      [[1, 0], [-1, 0], [0, 1], [0, -1]].forEach(function (v) { var nx = c[0] + v[0], ny = c[1] + v[1], k = nx + ',' + ny; if (nx < 0 || ny < 0 || nx >= W || ny >= H || !walk[ny][nx] || dist[k] != null) return; dist[k] = d + 1; prev[k] = c; q.push([nx, ny]); }); }
    return { dist: dist, prev: prev, cells: q };
  }
  function toCanvas(grid) { var c = mk(16, 16), q = c.getContext('2d'); grid.forEach(function (r, yy) { r.forEach(function (col, xx) { if (col) { q.fillStyle = col; q.fillRect(xx, yy, 1, 1); } }); }); return c; }
  var spots = []; for (y = 0; y < H; y++) for (x = 0; x < W; x++) if (walk[y][x]) spots.push([x, y]);
  var seen = {}, region = [];   // 서로 이어진 가장 큰 땅 (섬 같은 고립된 땅은 제외) — 덩어리마다 한 번만 훑음
  spots.forEach(function (s0) { var k0 = s0[0] + ',' + s0[1]; if (seen[k0]) return; var cells = bfs(s0[0], s0[1], 999).cells; cells.forEach(function (c) { seen[c[0] + ',' + c[1]] = 1; }); if (cells.length > region.length) region = cells; });
  SCENE_DATA.forEach(function (c, ci) {
    var grid = gridOf(c.px), wk = walkG(grid, false, true), fr = {};
    ['down', 'right', 'up', 'left'].forEach(function (d) { fr[d] = wk[d].map(toCanvas); });
    var sp = region[Math.floor(R() * region.length)];
    chars.push({ n: c.n, s: c.s, fr: fr, idle: toCanvas(squashG(grid)), x: sp[0] * T + 8 + (R() - .5) * 6, y: sp[1] * T + 14, dir: ['down', 'right', 'up', 'left'][ci % 4], path: [], wait: R() * 4, spd: 14 + R() * 8, ph: R() * 10 });
  });
  function pickTarget(c) {
    var cx = Math.floor(c.x / T), cy = Math.floor(c.y / T), b = bfs(cx, cy, 12), cand = b.cells.filter(function (p) { return b.dist[p[0] + ',' + p[1]] >= 3; });
    if (!cand.length) { c.wait = 2; return; }
    var t = cand[Math.floor(R() * cand.length)], k = t[0] + ',' + t[1], p = [];
    while (k && b.prev[k]) { var q = k.split(',').map(Number); p.unshift(q); var pr = b.prev[k]; k = pr[0] + ',' + pr[1]; if (pr[0] === cx && pr[1] === cy) break; }
    c.path = p;
  }

  // ---------- 화면 ----------
  var cv = document.getElementById('scene'), ctx = cv.getContext('2d'), nm = document.getElementById('names'), nctx = nm.getContext('2d'), wrap = document.getElementById('wrap');
  cv.width = PW; cv.height = PH; var scale = 1, dpr = window.devicePixelRatio || 1, sel = null;
  function fit() { scale = Math.max(.5, Math.min(3, window.innerWidth / PW)); wrap.style.width = PW * scale + 'px'; wrap.style.height = PH * scale + 'px'; cv.style.width = PW * scale + 'px'; cv.style.height = PH * scale + 'px'; nm.style.width = PW * scale + 'px'; nm.style.height = PH * scale + 'px'; nm.width = Math.round(PW * scale * dpr); nm.height = Math.round(PH * scale * dpr); }
  window.addEventListener('resize', fit); fit();
  var showNames = document.getElementById('showNames'), paused = false, card = document.getElementById('card');
  document.getElementById('pause').onclick = function () { paused = !paused; this.textContent = paused ? '▶ 재생' : '⏸ 멈춤'; };
  document.getElementById('cnt').textContent = chars.length + '명';
  window.SCENE_CHARS = chars;   // 확인용(읽기만)
  wrap.addEventListener('click', function (e) {
    var r = wrap.getBoundingClientRect(), mx = (e.clientX - r.left) / scale, my = (e.clientY - r.top) / scale, best = null, bd = 14;
    chars.forEach(function (c) { var d = Math.hypot(c.x - mx, c.y - 7 - my); if (d < bd) { bd = d; best = c; } });
    sel = best; card.style.display = best && best.n ? 'block' : 'none'; if (best) card.innerHTML = '<b>' + best.n + '</b>' + (best.s ? ' <span class="dim">· ' + best.s + '</span>' : '');
  });
  var last = performance.now(), T0 = last, fpsN = 0, fpsT = last, fpsEl = document.getElementById("fps");
  function frame(now) {
    fpsN++; if (now - fpsT >= 1000) { fpsEl.textContent = "FPS " + Math.round(fpsN * 1000 / (now - fpsT)); fpsN = 0; fpsT = now; }
    var dt = Math.min(.1, (now - last) / 1000); last = now; if (paused) dt = 0; var t = (now - T0) / 1000;
    chars.forEach(function (c) {
      if (c.path.length) {
        var nx = c.path[0][0] * T + 8, ny = c.path[0][1] * T + 14, dx = nx - c.x, dy = ny - c.y, d = Math.hypot(dx, dy), st = c.spd * dt;
        if (d <= st) { c.x = nx; c.y = ny; c.path.shift(); if (!c.path.length) c.wait = 1.5 + R() * 5; }
        else { c.x += dx / d * st; c.y += dy / d * st; c.dir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'); }
        c.walking = true;

    });
    for (var a = 0; a < chars.length; a++) for (var b2 = a + 1; b2 < chars.length; b2++) {

    }
    ctx.imageSmoothingEnabled = false; ctx.drawImage(ground, 0, 0);
    falls.forEach(function (f) { for (var k = 0; k < 5; k++) { var sx = f[0] * T + 1 + k * 3, off = Math.floor((t * 22 + k * 5 + f[1] * 3) % 16); rect(ctx, sx, f[1] * T + off, 2, 7, '#e8f6ff'); rect(ctx, sx + 1, f[1] * T + (off + 8) % 16, 1, 5, '#8fd3f7'); } });
    sparks.forEach(function (s) { if (Math.sin(t * 1.6 + s[2]) > .88) rect(ctx, s[0], s[1], 2, 1, '#e4f7ff'); });
    function drawObj(o) { var im = getObj(o); ctx.drawImage(im, Math.round(o.tx * T + 8 - im.width / 2 + o.ox + (o.kind === 'log' ? 8 : 0)), Math.round(o.by - im.height)); }
    function drawChar(c) {
      var img = c.walking ? c.fr[c.dir][Math.floor(t * 6.5 + c.ph) % 4] : (Math.floor(t * 1.6 + c.ph) % 2 ? c.idle : c.fr[c.dir][0]);
      ctx.fillStyle = 'rgba(20,50,20,.3)'; ctx.beginPath(); ctx.ellipse(Math.round(c.x), Math.round(c.y), 6, 2.2, 0, 0, 6.3); ctx.fill();
      ctx.drawImage(img, Math.round(c.x - 8), Math.round(c.y - 15));
    }
    var cs = chars.slice().sort(function (a, b) { return a.y - b.y; }), oi = 0;
    cs.forEach(function (c) { while (oi < objs.length && objs[oi].by <= c.y + 1) drawObj(objs[oi++]); drawChar(c); });
    while (oi < objs.length) drawObj(objs[oi++]);
    nctx.setTransform(1, 0, 0, 1, 0, 0); nctx.clearRect(0, 0, nm.width, nm.height);
    if (showNames.checked || sel) {
      var k = scale * dpr; nctx.textAlign = 'center'; nctx.textBaseline = 'bottom'; nctx.lineJoin = 'round';
      chars.forEach(function (c) {
        var on = c === sel; if (!showNames.checked && !on) return;
        nctx.font = (on ? 'bold ' : '') + Math.round((on ? 7 : 5.6) * k) + 'px "Malgun Gothic", system-ui, sans-serif';
        var tx = c.x * k, ty = (c.y - 17) * k; nctx.lineWidth = Math.max(2.5, 2 * k); nctx.strokeStyle = 'rgba(14,30,20,.85)'; nctx.strokeText(c.n, tx, ty); nctx.fillStyle = on ? '#fff3a8' : '#ffffff'; nctx.fillText(c.n, tx, ty);
        if (on) { nctx.strokeStyle = '#fff3a8'; nctx.lineWidth = 1.5 * k; nctx.beginPath(); nctx.ellipse(c.x * k, c.y * k, 9 * k, 3.5 * k, 0, 0, 6.3); nctx.stroke(); }
      });
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
