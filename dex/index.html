<style>
:root { --bg:#f6f3ee; --card:#fff; --ink:#26211c; --dim:#7a7068; --line:#e4ddd3; --pad:#e9e2d8; --gold:#d9a000; }
@media (prefers-color-scheme: dark) { :root { --bg:#17191c; --card:#22262a; --ink:#ece8e2; --dim:#9a9288; --line:#33383d; --pad:#33383d; --gold:#f0c040; } }
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 system-ui,"Malgun Gothic",sans-serif; }
header { padding:20px 16px 4px; max-width:1100px; margin:0 auto; }
h1 { margin:0 0 4px; font-size:20px; } h2 { margin:0 0 8px; font-size:16px; } h3 { margin:12px 0 4px; font-size:13px; color:var(--dim); font-weight:600; } header p { margin:0; color:var(--dim); font-size:13px; }
.evo { max-width:1100px; margin:8px auto 0; padding:0 16px; }
.box { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px; }
.ctl { display:flex; flex-wrap:wrap; gap:8px 12px; align-items:center; font-size:13px; }
.ctl input { width:54px; } .ctl select { max-width:160px; }
button { font:inherit; font-size:12px; padding:2px 9px; border:1px solid var(--line); border-radius:999px; background:var(--pad); color:var(--ink); cursor:pointer; }
.strip { display:grid; grid-template-columns:repeat(8,minmax(0,1fr)); gap:6px; margin:12px 0 6px; }
.stg { text-align:center; opacity:.35; border:2px solid transparent; border-radius:10px; padding:6px 2px; font-size:11px; line-height:1.3; cursor:pointer; }
.stg.done { opacity:.8; } .stg.on { opacity:1; border-color:var(--gold); background:var(--pad); } .stg.sel { outline:2px dashed var(--dim); }
canvas { image-rendering:pixelated; }
.stg canvas { width:100%; max-width:80px; height:auto; aspect-ratio:1; }
.row { display:flex; flex-wrap:wrap; gap:16px; align-items:flex-end; }
.walk canvas { width:80px; height:80px; background:var(--pad); border-radius:8px; } .walk div { text-align:center; font-size:11px; color:var(--dim); }
#portrait { width:192px; height:192px; background:var(--pad); border-radius:12px; }
#msg { margin:4px 0 0; font-size:13px; color:var(--dim); }
details { margin-top:8px; font-size:13px; } summary { cursor:pointer; }
table { border-collapse:collapse; width:100%; margin:6px 0; } td, th { border-bottom:1px solid var(--line); padding:3px 6px; text-align:left; vertical-align:top; }
main { max-width:1100px; margin:0 auto; padding:12px 16px 40px; display:grid; grid-template-columns:repeat(auto-fill,minmax(110px,1fr)); gap:10px; }
.card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px 6px; text-align:center; cursor:pointer; }
.card canvas { width:96px; height:96px; background:var(--pad); border-radius:8px; }
.nick { font-weight:700; margin-top:4px; } .sp { color:var(--dim); font-size:12px; }
